{% set name = "vaex-ml" %}
{% set version = "0.18.1" %}
{% set sha256 = "40f7efe41a60feb1cdc7e3529319b968b451710a9c1e5312096bb843dbe7a231" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  number: 1
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python {{ python_min }}
    - pip
  run:
    - python >={{ python_min }}
    - vaex-core >=4.8.0,<5
    - numba
    - traitlets
    - jinja2

test:
  requires:
    - python {{ python_min }}
  imports:
    - vaex.ml

about:
  home: https://www.github.com/vaexio/vaex
  license: MIT
  license_family: MIT
  license_file: LICENSE.txt
  summary: Machine learning support for vaex
  description: |
    Wrappers for various machine learning libraries to make them integrate into
    vaex.

extra:
  recipe-maintainers:
    - maartenbreddels
    - JovanVeljanoski
